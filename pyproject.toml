[project]
name = "silex"
version = "0.6.1"
description = "Authorization and audit kernel for robot and agent fleets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Max McCutcheon" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.6"]

[project.scripts]
silex = "silex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silex = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Explicit rule set so a new ruff release cannot change what CI enforces.
select = ["E4", "E7", "E9", "F", "I"]
