[project]
name = "silex"
version = "0.5.0"
description = "Authorized work operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Max McCutcheon" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
silex = "silex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silex = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
