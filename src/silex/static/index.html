<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silex</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d10; --panel:#12161b; --line:#222a32; --text:#e6edf3; --muted:#8b98a5; --accent:#c9f31d; --halt:#ff6b6b; --run:#7ec8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    h1 { margin: 0; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    main { display: grid; grid-template-columns: 1.05fr .95fr; gap: 16px; padding: 16px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    button, textarea { font: inherit; }
    button { background: #1b222b; color: var(--text); border: 1px solid #2a3440; border-radius: 8px; padding: 8px 11px; cursor: pointer; }
    button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 650; }
    button.danger { background: #3a1518; border-color: #6b2a30; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
    textarea { width: 100%; min-height: 70px; background: var(--bg); color: inherit; border: 1px solid #2a3440; border-radius: 8px; padding: 10px; }
    .status { font-size: 20px; font-weight: 650; letter-spacing: .04em; }
    .ok { color: var(--accent); } .bad { color: var(--halt); } .run { color: var(--run); }
    pre { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: #c5ced6; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Silex</h1>
      <div class="muted">Propose. Submit. Issue writ. Execute. Models do not move metal.</div>
    </div>
    <div id="chain" class="muted"></div>
  </header>
  <main>
    <section>
      <h2>Job</h2>
      <textarea id="goal" placeholder="Kit order-1 for SKU KIT-A"></textarea>
      <div class="row">
        <button id="propose">Propose</button>
        <button id="submit">Submit</button>
        <button id="issue" class="primary">Issue writ</button>
        <button id="tick">Tick</button>
        <button id="run">Run</button>
        <button id="revoke" class="danger">Revoke</button>
        <button id="failq">Fail quality</button>
        <button id="reset">Reset</button>
      </div>
      <div id="jobstatus" class="status muted">NO JOB</div>
      <p id="reason" class="muted"></p>
      <pre id="proposal"></pre>
    </section>
    <section>
      <h2>State</h2>
      <pre id="graph"></pre>
      <h2>Ledger</h2>
      <table id="ledger"></table>
    </section>
  </main>
  <script>
    const TOKEN = "__SILEX_TOKEN__";
    const $ = (id) => document.getElementById(id);
    async function api(path, body) {
      const res = await fetch(path, {
        method: body === undefined ? "GET" : "POST",
        headers: { "Content-Type": "application/json", "X-Silex-Token": TOKEN },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      render(await res.json());
    }
    function render(s) {
      if (s.error) $('reason').textContent = s.error;
      const job = s.job;
      const el = $('jobstatus');
      if (!job) { el.textContent = "NO JOB"; el.className = "status muted"; }
      else {
        el.textContent = job.status.toUpperCase() + "  " + job.cursor + "/" + job.steps.length;
        el.className = "status " + (job.status === "closed" ? "ok" : job.status === "halted" ? "bad" : "run");
        if (!s.error) $('reason').textContent = (job.halt_code ? job.halt_code + " — " : "") + (job.reason || job.steps.join(" → "));
      }
      $('chain').textContent = s.chain_ok ? "Ledger verified" : "Ledger broken";
      $('graph').textContent = JSON.stringify({ actor: s.actor, writ: s.writ, graph: s.graph }, null, 2);
      $('proposal').textContent = s.proposal ? JSON.stringify(s.proposal, null, 2) : "No proposal";
      $('ledger').innerHTML = (s.ledger || []).slice().reverse().map(e =>
        `<tr><td>${e.kind}</td><td>${JSON.stringify(e.payload)}</td><td class="muted">${e.digest}</td></tr>`
      ).join("");
    }
    $('propose').onclick = () => api('/api/propose', { text: $('goal').value || 'kit order-1' });
    $('submit').onclick = () => api('/api/submit', {});
    $('issue').onclick = () => api('/api/issue', {});
    $('tick').onclick = () => api('/api/tick', {});
    $('run').onclick = () => api('/api/run', {});
    $('revoke').onclick = () => api('/api/revoke', {});
    $('failq').onclick = () => api('/api/quality', { pass: false });
    $('reset').onclick = () => api('/api/reset', { quality_pass: true });
    api('/api/state');
  </script>
</body>
</html>
